# Isolates the effect of chunking: same retriever as the baseline, sections
# instead of fixed windows.
name: bm25-section

dataset:
  corpus_dir: ../datasets/aurora-health/corpus
  questions: ../datasets/aurora-health/questions.jsonl
  human_labels: ../datasets/aurora-health/human_labels.jsonl

chunker:
  name: section
  options:
    max_chars: 1200

retriever:
  type: bm25

top_k: 14

# Shared context budget. Every pipeline in the sweep shows the generator the
# same amount of text, so chunking strategies are compared on what they put in
# that budget rather than on how large their chunks happen to be.
context_chars: 2000
